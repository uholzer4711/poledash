[project]
name = "polestar-dash"
version = "0.1.0"
description = "Self-hosted web dashboard for Polestar 2 vehicle data"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlmodel>=0.0.22",
    "apscheduler>=3.10",
    "pypolestar>=1.12,<2.0",
    "python-multipart>=0.0.12",
    "prometheus-client>=0.21",
    "aiomqtt>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.7",
]

[project.scripts]
polestar-dash = "polestar_dash.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polestar_dash"]

[tool.hatch.build.targets.wheel.force-include]
"src/polestar_dash/templates" = "polestar_dash/templates"
"src/polestar_dash/static" = "polestar_dash/static"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# Line length is owned by the formatter (`ruff format`); enforcing E501 in the
# linter only fights un-splittable long strings/URLs, so we don't lint it.
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency/param markers are *meant* to be called in argument
# defaults — that's the framework idiom, not the B008 anti-pattern.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Path",
    "fastapi.Query",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
