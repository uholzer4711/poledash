[project]
name = "polestar-dash"
version = "0.1.0"
description = "Self-hosted web dashboard for Polestar 2 vehicle data"
readme = "README.md"
license = { text = "MIT" }
# unofficial-polestar-api (C3) requires 3.12 — the Docker image runs 3.12,
# and a 3.11 venv can't even install the project, so be honest here.
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlmodel>=0.0.22",
    "apscheduler>=3.10",
    "pypolestar>=1.12,<2.0",
    # pypolestar==1.12.7 imports `backoff` in graphql.py but doesn't declare it
    # (upstream issue pypolestar/pypolestar#81 — gql>=4.4.0 switched from
    # backoff to tenacity, so it's no longer pulled in transitively; the fix
    # landed on upstream main but was never tagged as a release). Pin it here
    # directly until a pypolestar release past 1.12.7 ships the fix.
    "backoff>=2.2",
    "python-multipart>=0.0.12",
    "prometheus-client>=0.21",
    "aiomqtt>=2.3",
    # Experimental C3 (Volvo Cloud Connectivity) client — powers the /test page
    # only (live GPS, exterior/lock, climate, air-quality). Isolated from the
    # pypolestar-based poll loop; imported lazily so a missing/broken build
    # never affects the rest of the app.
    "unofficial-polestar-api>=0.3.1,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.7",
]

[project.scripts]
polestar-dash = "polestar_dash.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `packages` already ships the whole src/polestar_dash tree (templates + static
# included). A separate force-include of those dirs duplicated every data file
# in the wheel archive, which current hatchling rejects ("a second file … at
# the same path"). Removed — packages alone is sufficient and unambiguous.
packages = ["src/polestar_dash"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# Line length is owned by the formatter (`ruff format`); enforcing E501 in the
# linter only fights un-splittable long strings/URLs, so we don't lint it.
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency/param markers are *meant* to be called in argument
# defaults — that's the framework idiom, not the B008 anti-pattern.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Path",
    "fastapi.Query",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
